<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .ink { stroke: #111; }
    @media (prefers-color-scheme: dark) { .ink { stroke: #fff; } }
    .slash { animation: slash 2.84s step-end infinite; }
    .close { animation: close 2.84s step-end infinite; }
    @keyframes slash { 0% { opacity: 0; } 7.75% { opacity: 1; } }
    @keyframes close { 0% { opacity: 0; } 15.5% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .slash, .close { animation: none; } }
  </style>
  <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path class="ink" d="M20 17 5 32l15 15"/>
    <path class="slash" d="M37 12 27 52" stroke="#3b82f6"/>
    <path class="ink close" d="M44 17l15 15-15 15"/>
  </g>
</svg>
